name: Oxlint

on:
    push:
        branches: [main]
    pull_request:

# Shared with the Biome workflow: both rewrite files, and running them at the same time lets one push race the other. Queuing instead of cancelling means a fix run always sees the latest commit.
concurrency:
    group: lint-fixes-${{ github.ref }}
    cancel-in-progress: false

# This workflow rewrites files and commits the fixes, so it needs write access to repository contents.
permissions:
    contents: write

jobs:
    oxlint:
        # The fixup push below would otherwise trigger another run that finds nothing to do.
        if: github.actor != 'github-actions[bot]'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  # `bun install` runs dependency install scripts on a push to main, and main auto-deploys. The
                  # checkout token is NOT persisted: it is supplied to the push alone, from the environment.
                  persist-credentials: false
                  ref: ${{ github.head_ref || github.ref_name }}
            # Oxlint is a devDependency, so it has to come from the lockfile rather than a floating `bunx oxlint` download.
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ~/.bun/install/cache
                  key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
                  restore-keys: |
                      bun-${{ runner.os }}-

            - run: bun install --frozen-lockfile

            # Type-aware linting reads the project's types, and the two sets CI needs most are gitignored: the Prisma contract (`/src/app/generated`) and Next's type declarations (`next-env.d.ts` and `.next/types`). Without them every import through those is `error` typed, which type-aware rules report as thousands of "unsafe assignment of an error typed value" warnings – the local machine already has both from `dev`/`build`, so the flood only shows up here. Same two steps, in the same order, as the CI workflow.
            - run: bun run db:generate
            - run: bunx next typegen

            # `--fix` applies Oxlint's safe fixes only. Suggestions are left alone because they can change behaviour.
            - name: Apply Oxlint fixes
              run: bunx oxlint --fix
            - name: Commit fixes
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add -A
                  if ! git diff --cached --quiet; then
                    git commit -m "Apply Oxlint fixes"
                    # The token is handed to this one push rather than left in .git/config where an install script
                    # or a compromised dependency could read it.
                    git -c credential.helper='!f() { echo username=x-access-token; echo "password=${GH_TOKEN}"; }; f' \
                      push origin "HEAD:${{ github.head_ref || github.ref_name }}"
                  fi
