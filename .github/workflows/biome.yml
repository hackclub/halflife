name: Biome

on:
    push:
        branches: [main]
    pull_request:

# Shared with the Oxlint workflow: both rewrite files, and running them at the same time lets one push race the other. Queuing instead of cancelling means a fix run always sees the latest commit.
concurrency:
    group: lint-fixes-${{ github.ref }}
    cancel-in-progress: false

# This workflow rewrites files and commits the fixes, so it needs write access to repository contents.
permissions:
    contents: write

jobs:
    biome:
        # The fixup push below would otherwise trigger another run that finds nothing to do.
        if: github.actor != 'github-actions[bot]'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  # The token is not persisted in .git/config; the commit step gets it from the environment for its
                  # one push. This job does not install dependencies, but the habit is the same one the Oxlint
                  # workflow needs.
                  persist-credentials: false
                  ref: ${{ github.head_ref || github.ref_name }}
            # Biome ships as a single binary, so there is no Bun toolchain or `bun install` (~1min) just to run the formatter. The version is pinned here to match the devDependency in bun.lock: setup-biome only reads npm, pnpm and yarn lockfiles, so left to detect it, it fell back to a release that rejects rules in biome.json.
            - uses: biomejs/setup-biome@77af1e9ce0cc32955e83b0c3e30c28ae3b81cab7 # v2
              with:
                  version: 2.6.3

            # `check` covers format, lint and organise-imports in one pass, so one run and one fixup commit instead of two of each.
            - name: Apply Biome fixes
              run: biome check --write .
            - name: Commit fixes
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add -A
                  if ! git diff --cached --quiet; then
                    git commit -m "Apply Biome fixes"
                    git -c credential.helper='!f() { echo username=x-access-token; echo "password=${GH_TOKEN}"; }; f' \
                      push origin "HEAD:${{ github.head_ref || github.ref_name }}"
                  fi
