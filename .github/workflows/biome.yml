name: Biome

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: biome-${{ github.ref }}
  cancel-in-progress: true

# This workflow rewrites files and commits the fixes, so it needs write access to
# repository contents. The cache still authenticates via the Actions runtime token.
permissions:
  contents: write

jobs:
  biome:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Format files with Biome
        run: bunx biome format --write .
      - name: Commit formatting fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Format files with Biome"
            git push
          fi

      - name: Biome lint check fixes
        run: bunx biome check --write .
      - name: Commit lint fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Biome lint check fixes"
            git push
          fi