name: Biome

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: biome-${{ github.ref }}
    cancel-in-progress: true

# This workflow rewrites files and commits the fixes, so it needs write access to
# repository contents.
permissions:
    contents: write

jobs:
    biome:
        # The fixup push below would otherwise trigger another run that finds
        # nothing to do.
        if: github.actor != 'github-actions[bot]'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v5
              with:
                  ref: ${{ github.head_ref || github.ref_name }}
                  token: ${{ secrets.GITHUB_TOKEN }}
            # Biome ships as a single binary, so there is no Bun toolchain or
            # `bun install` (~1min) just to run the formatter. The version is
            # auto-detected from bun.lock, matching the pinned devDependency.
            - uses: biomejs/setup-biome@v2

            # `check` covers format, lint and organise-imports in one pass, so one
            # run and one fixup commit instead of two of each.
            - name: Apply Biome fixes
              run: biome check --write .
            - name: Commit fixes
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add -A
                  if ! git diff --cached --quiet; then
                    git commit -m "Apply Biome fixes"
                    git push
                  fi
