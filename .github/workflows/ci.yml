name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

# Read-only: nothing here writes to the repository. The job reads the checkout and reports. Stated explicitly so the token cannot inherit a read-write default from an older repository or organisation.
# Note: there is no database in CI, so nothing here may dial one. The
# DB-backed checks (migrate deploy, seed, verify:ledger/onboarding/feed/store/handoff) run locally against a scratch database instead.
permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v5
            # No bun-version: setup-bun reads packageManager (bun@1.4.3), which
            # hits the runner tool cache instead of downloading `latest` every
            # run, and keeps CI on the same toolchain as local dev.
            - uses: oven-sh/setup-bun@v2

            - uses: actions/cache@v4
              with:
                  path: ~/.bun/install/cache
                  key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
                  restore-keys: |
                      bun-${{ runner.os }}-

            # Next.js incremental build cache. Keyed on sources for an exact hit
            # when nothing changed, falling back to the lockfile prefix otherwise;
            # Next invalidates stale entries itself.
            - uses: actions/cache@v4
              with:
                  path: .next/cache
                  key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**', 'prisma/**', 'next.config.ts', 'tsconfig.json', 'package.json') }}
                  restore-keys: |
                      nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
                      nextjs-${{ runner.os }}-

            - run: bun install --frozen-lockfile

            # The Prisma client is gitignored, so typegen, typecheck and build all
            # fail without this. It has to come first.
            - run: bunx prisma generate

            # `next-env.d.ts` and `.next/types` are gitignored but required for
            # typecheck: image imports resolve through next/image-types/global and
            # LayoutProps through the generated route types. `next typegen` creates
            # both without a full build.
            - run: bunx next typegen

            # `bun check` rather than `bun run typecheck`: it is the built-in, reads the same tsconfig (paths, strict flags, the generated/ exclude) and enforces .next/types, so the `next typegen` step above still earns its place.
            # Typecheck and ESLint touch disjoint inputs, so run them concurrently
            # rather than sequentially. The `||` guards keep `set -e` from
            # exiting on the first `wait` before the other status is collected.
            - name: Check and lint
              run: |
                  CHECK_STATUS=0
                  LINT_STATUS=0
                  bun check & CHECK_PID=$!
                  bun run lint & LINT_PID=$!
                  wait $CHECK_PID || CHECK_STATUS=$?
                  wait $LINT_PID || LINT_STATUS=$?
                  exit $(( CHECK_STATUS || LINT_STATUS ))

            # Static regression checks: no database, no network, no secrets.
            # verify-loops pins the Signups join (id over email, skip-not-throw);
            # verify-contracts pins the client↔API contract (fetch methods vs
            # route exports, request bodies vs zod schemas, plus pure-lib pins);
            # verify-forge-write pins the write path's retry/classification with a
            # scripted fetch. All hermetic: no database, no network, no secrets.
            - name: Static regression checks
              run: |
                  bun run verify:loops
                  bun run verify:contracts
                  bun run verify:forge-write

            - name: Build
              env:
                  CI: "true"
                  BETTER_AUTH_SECRET: ci-placeholder-secret-at-least-32-chars
                  BETTER_AUTH_URL: http://localhost:3000
                  # Never dialed: the build does not touch the database, but
                  # Prisma client initialisation requires the variable present.
                  DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
              run: bun run build
