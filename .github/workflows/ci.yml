name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

# Read-only, for the same reason as biome.yml: nothing here writes to the repository. Both jobs read the checkout and report, and the migrations job resets a throwaway Postgres service container rather than anything shared. Stated explicitly so the token cannot inherit a read-write default from an older repository or organisation.
permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v5
            # No bun-version: setup-bun reads packageManager (bun@1.4.3), which
            # hits the runner tool cache instead of downloading `latest` every
            # run, and keeps CI on the same toolchain as local dev.
            - uses: oven-sh/setup-bun@v2

            - uses: actions/cache@v4
              with:
                  path: ~/.bun/install/cache
                  key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
                  restore-keys: |
                      bun-${{ runner.os }}-

            # Next.js incremental build cache. Keyed on sources for an exact hit
            # when nothing changed, falling back to the lockfile prefix otherwise;
            # Next invalidates stale entries itself.
            - uses: actions/cache@v4
              with:
                  path: .next/cache
                  key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**', 'prisma/**', 'next.config.ts', 'tsconfig.json', 'package.json') }}
                  restore-keys: |
                      nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
                      nextjs-${{ runner.os }}-

            - run: bun install --frozen-lockfile

            # The Prisma client is gitignored, so typegen, typecheck and build all
            # fail without this. It has to come first.
            - run: bunx prisma generate

            # `next-env.d.ts` and `.next/types` are gitignored but required for
            # typecheck: image imports resolve through next/image-types/global and
            # LayoutProps through the generated route types. `next typegen` creates
            # both without a full build.
            - run: bunx next typegen

            # `bun check` rather than `bun run typecheck`: it is the built-in, reads the same tsconfig (paths, strict flags, the generated/ exclude) and enforces .next/types, so the `next typegen` step above still earns its place.
            # Typecheck and ESLint touch disjoint inputs, so run them concurrently
            # rather than sequentially. The `||` guards keep `set -e` from
            # exiting on the first `wait` before the other status is collected.
            - name: Check and lint
              run: |
                  CHECK_STATUS=0
                  LINT_STATUS=0
                  bun check & CHECK_PID=$!
                  bun run lint & LINT_PID=$!
                  wait $CHECK_PID || CHECK_STATUS=$?
                  wait $LINT_PID || LINT_STATUS=$?
                  exit $(( CHECK_STATUS || LINT_STATUS ))

            # Static regression checks: no database, no network, no secrets.
            # verify-loops pins the Signups join (id over email, skip-not-throw);
            # verify-contracts pins the client↔API contract (fetch methods vs
            # route exports, request bodies vs zod schemas, plus pure-lib pins);
            # verify-forge-write pins the write path's retry/classification with a
            # scripted fetch. All hermetic, so they live in this job rather than
            # needing the Postgres service below.
            - name: Static regression checks
              run: |
                  bun run verify:loops
                  bun run verify:contracts
                  bun run verify:forge-write

            - name: Build
              env:
                  CI: "true"
                  BETTER_AUTH_SECRET: ci-placeholder-secret-at-least-32-chars
                  BETTER_AUTH_URL: http://localhost:3000
                  DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
              run: bun run build

    migrations:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: halflife_ci
                ports: ["5432:5432"]
                # 1s health polling (was 5s) so the job starts as soon as Postgres
                # is ready, and a tmpfs data dir so migrations and the seed run
                # in RAM instead of on the runner's disk.
                options: >-
                    --health-cmd pg_isready --health-interval 1s
                    --health-timeout 2s --health-retries 15
                    --tmpfs /var/lib/postgresql/data
        env:
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/halflife_ci
        steps:
            - uses: actions/checkout@v5
            # Same pinned-toolchain reasoning as the verify job: omit bun-version
            # so setup-bun reads packageManager and hits the tool cache.
            - uses: oven-sh/setup-bun@v2

            - uses: actions/cache@v4
              with:
                  path: ~/.bun/install/cache
                  key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
                  restore-keys: |
                      bun-${{ runner.os }}-

            - run: bun install --frozen-lockfile
            - run: bunx prisma generate

            # Migrations must apply cleanly from nothing. Both reference programs
            # deploy migrations at container start with no CI check, which means a bad
            # migration is discovered as a crashlooping production pod.
            - name: Apply migrations from scratch
              run: bunx prisma migrate deploy

            # And the committed schema has to match the migration history — the
            # failure mode where someone edits schema.prisma and forgets to migrate.
            # Prisma 7 takes the shadow database URL from prisma.config.ts, so this
            # needs a database it is allowed to reset — hence a separate one from the
            # migration target above.
            - name: Schema matches migrations
              env:
                  SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/halflife_shadow
              run: |
                  PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE halflife_shadow'
                  bunx prisma migrate diff \
                    --from-migrations prisma/migrations \
                    --to-schema prisma/schema.prisma \
                    --exit-code

            # The seed runs under Bun (`bun prisma/seed.ts`), so no setup-node needed.
            - run: bun run db:seed

            # DB regression checks, against the freshly migrated + seeded throwaway
            # database above – the same harness the scripts ask for ("against a
            # scratch database"). Each self-seeds timestamped fixtures and deletes
            # them afterwards; verify-handoff additionally skips its R2 round trip
            # when uploads are unconfigured (as here), so no secrets needed.
            # verify-ledger pins the money path (approve/unapprove idempotence,
            # concurrent-purchase lock, single-pot minting); verify-onboarding
            # pins the first checkpoint (no step-skipping, tier/requestedTier
            # split); verify-feed pins the doomscroller; verify-store pins the
            # database→trail seam.
            # Not here: verify-handoff requires R2 credentials (minting fails
            # closed when uploads are unconfigured), and CI has no bucket – it
            # runs locally with S3_* set.
            - name: DB regression checks
              run: |
                  bun run verify:ledger
                  bun run verify:onboarding
                  bun run verify:feed
                  bun run verify:store
