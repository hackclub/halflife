name: E2E

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: e2e-${{ github.ref }}
    cancel-in-progress: true

# Read-only: the job only reads the checkout and reports.
permissions:
    contents: read

jobs:
    playwright:
        runs-on: ubuntu-latest
        timeout-minutes: 25

        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: halflife_e2e
                ports: ["5432:5432"]
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 2s
                    --health-timeout 3s
                    --health-retries 20

        env:
            # The reset script drops and recreates this database, which is why its name must end in _e2e.
            E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/halflife_e2e
            E2E_BASE_URL: http://localhost:3100
            E2E_AUTH_SECRET: e2e-placeholder-secret-at-least-32-characters-long
            # The app reads this at build time (Prisma client initialisation) and the E2E server overrides it with the same URL.
            DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/halflife_e2e
            BETTER_AUTH_SECRET: e2e-placeholder-secret-at-least-32-characters-long
            BETTER_AUTH_URL: http://localhost:3100
            # NEXT_PUBLIC_* is inlined during `next build`, so it has to be right in this environment, not just in webServer.env.
            NEXT_PUBLIC_APP_URL: http://localhost:3100
            NEXT_TELEMETRY_DISABLED: "1"

        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 22

            - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: |
                      ~/.bun/install/cache
                      ~/.cache/ms-playwright
                  key: e2e-${{ runner.os }}-${{ hashFiles('bun.lock') }}
                  restore-keys: |
                      e2e-${{ runner.os }}-

            - run: bun install --frozen-lockfile
            # The Prisma contract is gitignored; the build and the database helpers need it emitted first.
            - run: bun run db:generate
            - run: bunx playwright install --with-deps chromium

            - name: Create and seed the test database
              run: bun run e2e:db

            # `CI` is blank on purpose: next.config treats CI as a deploy build and emits a standalone bundle, which `next start` refuses. The E2E job tests the ordinary server, and the main CI workflow still covers the deploy build.
            - name: Build
              env:
                  CI: ""
              run: bun run build

            - name: Run Playwright
              run: bun run test:e2e:only

            - name: Upload failure artifacts
              if: failure()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: playwright-${{ github.run_attempt }}
                  path: |
                      playwright-report/
                      test-results/
                  if-no-files-found: ignore
                  retention-days: 7
