services:
    postgres:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: halflife
        ports: ["127.0.0.1:5432:5432"]
        volumes: ["halflife-pgdata:/var/lib/postgresql/data"]
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 2s
            timeout: 3s
            retries: 20

volumes:
    halflife-pgdata:
